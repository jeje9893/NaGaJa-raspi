<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0">
  <title>나가자 — 출발 타이머</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --fd: 'Courier New', 'Lucida Console', monospace;
      --fb: 'Arial', sans-serif;
      /* 파스텔 테마 텍스트 색 */
      --txt-primary:   #1c1c1c;
      --txt-secondary: #555;
      --txt-muted:     #888;
      /* 카드 배경 */
      --card-bg:       rgba(255,255,255,0.60);
      --card-border:   rgba(0,0,0,0.08);
      --card-bg-hi:    rgba(255,255,255,0.85);
      --divider:       rgba(0,0,0,0.08);
    }
    html, body {
      width: 800px; height: 480px;
      overflow: hidden;
      background: #eef4f0;
      color: var(--txt-primary);
      font-family: var(--fb);
      user-select: none;
    }
    #app {
      display: flex; width: 100%; height: 100%;
      position: relative;
      transition: background 0.7s;
    }
    /* ── 파스텔 상태별 배경 ── */
    #app.relaxed { background: #dff0e4; }   /* 민트 그린 파스텔 */
    #app.hurry   { background: #fef6d6; }   /* 버터 옐로 파스텔 */
    #app.late    { background: #fde8e5; }   /* 로즈 파스텔    */
    #app.give-up { background: #e8e8e8; }   /* 뉴트럴 그레이   */

    /* ══ 좌: 타이머 섹션 480×480 ══ */
    #timer-section {
      width: 480px; height: 480px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    #timer-svg {
      position: absolute; top: 0; left: 0;
      width: 480px; height: 480px;
    }

    /* 링 색상: 밝은 배경에 맞게 채도 조금 낮춤 */
    .ring-track   { fill: none; stroke: rgba(0,0,0,0.07); stroke-width: 22; }
    .ring-relaxed { fill: none; stroke: #34c465; stroke-width: 22; stroke-linecap: butt; }
    .ring-hurry   { fill: none; stroke: #f0b429; stroke-width: 22; stroke-linecap: butt; }
    .ring-late    { fill: none; stroke: #e84545; stroke-width: 22; stroke-linecap: butt; }

    /* 구간 이름 레이블 (링 바깥) */
    .seg-label { font-size: 12px; font-weight: bold; font-family: Arial, sans-serif; }

    /*
      경계 시각 pill 배지:
      SVG <foreignObject>로 HTML pill을 올리기 어려우므로,
      SVG <rect> + <text> 조합으로 둥근 배지를 JS로 그린다.
      각 경계마다 <g id="badge-*"> 그룹을 미리 만들어두고
      JS가 rect/text를 동적으로 업데이트한다.
    */

    /* 중앙 텍스트 */
    #center-display {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; width: 210px;
    }
    #state-label {
      font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; opacity: 0.5;
      margin-bottom: 6px; font-family: var(--fb);
      transition: color 0.6s;
    }
    #countdown {
      font-family: var(--fd);
      font-size: 60px; font-weight: bold;
      line-height: 1; letter-spacing: -2px;
      transition: color 0.6s;
    }
    #countdown-sub {
      font-size: 10px; color: var(--txt-muted);
      margin-top: 8px; letter-spacing: 0.08em;
      font-family: var(--fb);
    }

    /* ══ 우: 정보 패널 320px ══ */
    #info-section {
      width: 320px; height: 100%;
      display: flex; flex-direction: column;
      padding: 14px 14px 12px 6px;
      gap: 6px; overflow: hidden;
    }
    #top-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--divider);
    }
    #current-time { font-family: var(--fd); font-size: 26px; font-weight: bold; line-height: 1; color: var(--txt-primary); }
    #class-info   { text-align: right; }
    #class-time   { font-size: 9px; color: var(--txt-muted); margin-bottom: 1px; }
    #class-name   { font-size: 12px; font-weight: bold; color: var(--txt-primary); }

    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .info-card-label { font-size: 8px; color: var(--txt-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
    .info-card-value { font-family: var(--fd); font-size: 15px; font-weight: bold; color: var(--txt-primary); }
    .info-card-icon  { font-size: 14px; opacity: 0.35; }

    #depart-card  { background: var(--card-bg-hi); border-color: rgba(0,0,0,0.13); }
    #depart-value { font-size: 18px; }
    #wake-card    { display: none; border-color: rgba(80,100,200,0.2); background: rgba(220,225,255,0.6); }
    #wake-card.visible { display: flex; }
    #wake-value   { color: #3a4ab0; }
    #taxi-card    { display: none; border-color: rgba(220,60,60,0.3); background: rgba(255,220,215,0.7); }
    #taxi-card.visible { display: flex; }
    #taxi-value   { color: #c0392b; }
    #bus-card     { display: none; }
    #bus-card.visible { display: flex; }

    #bottom-row   { display: flex; gap: 5px; margin-top: auto; }
    #bottom-row .info-card { flex: 1; }
    .divider      { width: 1px; background: var(--divider); align-self: stretch; margin: 0 2px; }
    #weather-badge { display: inline-flex; font-size: 8px; padding: 1px 5px; border-radius: 99px; background: rgba(0,0,0,0.07); margin-top: 2px; color: var(--txt-secondary); }

    /* ══ 포기 오버레이 ══ */
    #give-up-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(230,230,230,0.95);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; z-index: 99;
    }
    #give-up-overlay.visible { display: flex; }
    #give-up-emoji { font-size: 72px; animation: gup 3s ease-in-out infinite; }
    @keyframes gup { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }
    #give-up-title { font-size: 32px; font-weight: bold; color: #888; }
    #give-up-sub   { font-size: 13px; color: #aaa; letter-spacing: 0.05em; }
    #give-up-clock { font-family: var(--fd); font-size: 48px; color: #bbb; margin-top: 4px; }

    @keyframes blink-red { 0%,100%{opacity:1} 50%{opacity:.35} }
    #app.late #countdown { animation: blink-red 1.2s ease-in-out infinite; }
  </style>
</head>
<body>
<div id="app" class="relaxed">

  <!-- ══ 좌: 원형 타이머 ══ -->
  <div id="timer-section">
    <!--
      viewBox 480×480 | cx=cy=240 | r=200 | stroke=22
      CIRC = 2π×200 ≈ 1256.64
    -->
    <svg id="timer-svg" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
      <!-- 배경 트랙 -->
      <circle class="ring-track" cx="240" cy="240" r="200"/>

      <!-- 세그먼트 -->
      <circle id="seg-relaxed" class="ring-relaxed" cx="240" cy="240" r="200"
              transform="rotate(-90 240 240)"
              stroke-dasharray="0 1256.64" stroke-dashoffset="0"/>
      <circle id="seg-hurry"   class="ring-hurry"   cx="240" cy="240" r="200"
              transform="rotate(-90 240 240)"
              stroke-dasharray="0 1256.64" stroke-dashoffset="0"/>
      <circle id="seg-late"    class="ring-late"    cx="240" cy="240" r="200"
              transform="rotate(-90 240 240)"
              stroke-dasharray="0 1256.64" stroke-dashoffset="0"/>

      <!-- 포인터 -->
      <circle id="pointer" r="11" fill="#333" cx="240" cy="40"/>

      <!-- 구간 이름 레이블 (링 바깥) -->
      <text id="lbl-relaxed" class="seg-label" fill="#1a7a3a" text-anchor="middle" dominant-baseline="middle"></text>
      <text id="lbl-hurry"   class="seg-label" fill="#a07000" text-anchor="middle" dominant-baseline="middle"></text>
      <text id="lbl-late"    class="seg-label" fill="#b02020" text-anchor="middle" dominant-baseline="middle"></text>

      <!--
        경계 시각 배지:
        각 경계점에 <g> 그룹 배치. JS가 <rect>(pill)와 <text>를 채운다.
        rect: 둥근 모서리, 해당 구간 색의 진한 버전으로 fill
        text: 흰색
      -->
      <!-- 시작(준비 시작) — 항상 12시 방향 -->
      <g id="badge-start">
        <rect id="br-start" rx="6" ry="6" fill="#34c465" opacity="0.9"/>
        <text id="bt-start" font-size="10" fill="white" font-weight="bold"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Courier New',monospace"></text>
      </g>
      <!-- 여유→나가자 경계 -->
      <g id="badge-b1">
        <rect id="br-b1" rx="6" ry="6" fill="#f0b429" opacity="0.9"/>
        <text id="bt-b1" font-size="10" fill="white" font-weight="bold"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Courier New',monospace"></text>
      </g>
      <!-- 나가자→지각 경계 -->
      <g id="badge-b2">
        <rect id="br-b2" rx="6" ry="6" fill="#e84545" opacity="0.9"/>
        <text id="bt-b2" font-size="10" fill="white" font-weight="bold"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Courier New',monospace"></text>
      </g>
      <!-- 끝(택시 마지노선) -->
      <g id="badge-end">
        <rect id="br-end" rx="6" ry="6" fill="#c03030" opacity="0.9"/>
        <text id="bt-end" font-size="10" fill="white" font-weight="bold"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Courier New',monospace"></text>
      </g>
    </svg>

    <!-- 중앙 텍스트 -->
    <div id="center-display">
      <div id="state-label">여유</div>
      <div id="countdown">00:00</div>
      <div id="countdown-sub">출발까지 남은 시간</div>
    </div>
  </div>

  <!-- ══ 우: 정보 패널 ══ -->
  <div id="info-section">
    <div id="top-row">
      <div id="current-time">--:--</div>
      <div id="class-info">
        <div id="class-time">수업 시작</div>
        <div id="class-name">--:--</div>
      </div>
    </div>

    <div class="info-card" id="wake-card">
      <div><div class="info-card-label">기상 알람</div><div class="info-card-value" id="wake-value">--:--</div></div>
      <div class="info-card-icon">🔔</div>
    </div>
    <div class="info-card" id="depart-card">
      <div><div class="info-card-label">권장 출발 시각</div><div class="info-card-value" id="depart-value">--:--</div></div>
      <div class="info-card-icon">🚶</div>
    </div>
    <div class="info-card">
      <div><div class="info-card-label">준비 시작 시각</div><div class="info-card-value" id="prep-value">--:--</div></div>
      <div class="info-card-icon">⏰</div>
    </div>
    <div class="info-card" id="taxi-card">
      <div><div class="info-card-label">택시 마지노선</div><div class="info-card-value" id="taxi-value">--:--</div></div>
      <div class="info-card-icon">🚕</div>
    </div>
    <div class="info-card" id="bus-card">
      <div><div class="info-card-label">다음 버스</div><div class="info-card-value" id="bus-value">--분 후</div></div>
      <div class="info-card-icon">🚌</div>
    </div>

    <div id="bottom-row">
      <div class="info-card">
        <div><div class="info-card-label">이동 시간</div><div class="info-card-value" id="travel-value">--분</div></div>
        <div class="info-card-icon">🗺️</div>
      </div>
      <div class="divider"></div>
      <div class="info-card">
        <div>
          <div class="info-card-label">날씨</div>
          <div class="info-card-value" id="weather-value">--</div>
          <div id="weather-badge"><span id="weather-delay">+0분</span> 보정</div>
        </div>
        <div class="info-card-icon">🌤️</div>
      </div>
    </div>
  </div>

  <!-- ══ 포기 오버레이 ══ -->
  <div id="give-up-overlay">
    <div id="give-up-emoji">😮‍💨</div>
    <div id="give-up-title">오늘은 포기..?</div>
    <div id="give-up-sub">택시를 타도 지각입니다</div>
    <div id="give-up-clock">--:--</div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   나가자 — 타이머 UI  v1.3  (파스텔 테마 + pill 배지)
   SVG: viewBox 480×480 | cx=cy=240 | r=200 | stroke=22
   CIRC = 2π×200 ≈ 1256.64
   ════════════════════════════════════════════ */

const NAGAJA_CONFIG = {
  dataSource: 'demo',
  stateFilePath: '/tmp/nagaja_state.json',
  wsUrl: 'ws://localhost:8765',
  pollIntervalMs: 2000,
};

const R = 200, CX = 240, CY = 240;
const CIRC = 2 * Math.PI * R;
const STATE = { RELAXED:'relaxed', HURRY:'hurry', LATE:'late', GIVE_UP:'give-up' };

let nagajaData = {
  wakeUpTime:null,
  classStartTime:'09:00', className:'전공필수',
  departureTime:'08:20', prepStartTime:'07:50', taxiDeadline:'08:35',
  travelMinutes:25, weatherCondition:'맑음', weatherDelay:0, busNextMinutes:null,
};

function pad(n){ return String(n).padStart(2,'0'); }
function toMins(str){ const [h,m]=str.split(':').map(Number); return h*60+m; }
function nowMins(){ const d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; }
function nowStr(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function mmss(mins){
  if(mins<0) mins=0;
  const m=Math.floor(mins), s=Math.round((mins-m)*60);
  return pad(m)+':'+pad(s);
}
function segDash(from,to){
  const len=(to-from)*CIRC;
  return { da:`${len} ${CIRC-len}`, doff:-from*CIRC };
}
function ratioToXY(ratio, r){
  const rad=(ratio*360-90)*Math.PI/180;
  return { x: CX+r*Math.cos(rad), y: CY+r*Math.sin(rad) };
}

/* ── pill 배지 배치 ──
   링 안쪽 r-32 위치에 rect+text 배지를 그린다.
   텍스트 폭 측정 후 rect를 텍스트 크기에 맞게 조정한다.
*/
function placeBadge(prefix, ratio, label, fillColor){
  const el_r = document.getElementById('br-'+prefix);
  const el_t = document.getElementById('bt-'+prefix);
  if(!label){ el_r.setAttribute('width','0'); el_t.textContent=''; return; }

  const BADGE_R = R - 32;          // 링 안쪽
  const p = ratioToXY(ratio, BADGE_R);

  el_r.setAttribute('fill', fillColor);

  // 텍스트 먼저 설정 → getBBox로 폭 측정
  el_t.setAttribute('x', p.x.toFixed(1));
  el_t.setAttribute('y', p.y.toFixed(1));
  el_t.textContent = label;

  let tw = 36; // 폴백 폭 (getBBox 불가 시)
  try { tw = el_t.getBBox().width; } catch(e){}

  const pw = tw + 12, ph = 16;
  el_r.setAttribute('x', (p.x - pw/2).toFixed(1));
  el_r.setAttribute('y', (p.y - ph/2).toFixed(1));
  el_r.setAttribute('width', pw.toFixed(1));
  el_r.setAttribute('height', ph.toFixed(0));
}

function determineState(nm,d){
  const dep=toMins(d.departureTime), taxi=toMins(d.taxiDeadline);
  if(nm >= taxi+d.travelMinutes) return STATE.GIVE_UP;
  if(nm >= dep)    return STATE.LATE;
  if(nm >= dep-10) return STATE.HURRY;
  return STATE.RELAXED;
}

function updateRing(nm,d){
  const ps=toMins(d.prepStartTime), dep=toMins(d.departureTime), taxi=toMins(d.taxiDeadline);
  const total=taxi-ps;
  const r0=0;
  const r1=Math.max(0, Math.min(1, (dep-10-ps)/total));
  const r2=Math.max(r1, Math.min(1, (dep-ps)/total));
  const r3=1;

  function setS(id,fr,to){
    const s=segDash(fr,to), el=document.getElementById(id);
    el.setAttribute('stroke-dasharray',s.da);
    el.setAttribute('stroke-dashoffset',s.doff);
  }
  setS('seg-relaxed',r0,r1);
  setS('seg-hurry',r1,r2);
  setS('seg-late',r2,r3);

  // 포인터
  const nr=Math.max(0,Math.min(1,(nm-ps)/total));
  const pp=ratioToXY(nr, R);
  document.getElementById('pointer').setAttribute('cx',pp.x.toFixed(1));
  document.getElementById('pointer').setAttribute('cy',pp.y.toFixed(1));

  // 구간 이름 (링 바깥 r+30)
  function placeSegLabel(id,fr,to,txt){
    const el=document.getElementById(id);
    if(to-fr < 0.045){ el.textContent=''; return; }
    const p=ratioToXY((fr+to)/2, R+30);
    el.setAttribute('x',p.x.toFixed(1));
    el.setAttribute('y',p.y.toFixed(1));
    el.textContent=txt;
  }
  placeSegLabel('lbl-relaxed',r0,r1,'여유');
  placeSegLabel('lbl-hurry',r1,r2,'나가자');
  placeSegLabel('lbl-late',r2,r3,'지각');

  // 경계 시각 pill 배지
  const dep10h=Math.floor((dep-10)/60), dep10m=(dep-10)%60;
  placeBadge('start', 0,   d.prepStartTime,                      '#34c465');
  placeBadge('b1',    r1,  pad(dep10h)+':'+pad(dep10m),          '#e8a020');
  placeBadge('b2',    r2,  d.departureTime,                      '#e84545');
  placeBadge('end',   1,   d.taxiDeadline,                       '#b02020');
}

function updateStateUI(state,nm,d){
  document.getElementById('app').className=state;
  const dep=toMins(d.departureTime), taxi=toMins(d.taxiDeadline);
  const taxiCard=document.getElementById('taxi-card');
  const giveUp=document.getElementById('give-up-overlay');
  const countdown=document.getElementById('countdown');
  const stateLabel=document.getElementById('state-label');
  const countSub=document.getElementById('countdown-sub');

  if(state===STATE.GIVE_UP){
    giveUp.classList.add('visible');
    document.getElementById('give-up-clock').textContent=nowStr();
    return;
  }
  giveUp.classList.remove('visible');
  taxiCard.classList.toggle('visible', state===STATE.LATE);

  let rem,lbl,sub,col;
  if(state===STATE.RELAXED){
    rem=dep-10-nm; lbl='여유'; sub='출발까지 남은 시간'; col='#1a7a3a';
  } else if(state===STATE.HURRY){
    rem=dep-nm; lbl='나가자!'; sub='지금 출발하면 정각 도착'; col='#a07000';
  } else {
    rem=taxi-nm; lbl='지각 위기'; sub='택시 마지노선까지'; col='#b02020';
  }
  stateLabel.textContent=lbl; stateLabel.style.color=col;
  countdown.textContent=mmss(rem); countdown.style.color=col;
  countSub.textContent=sub;
}

function updateInfoPanel(d){
  document.getElementById('current-time').textContent=nowStr();
  document.getElementById('class-name').textContent=d.classStartTime;
  document.getElementById('class-time').textContent=d.className;
  document.getElementById('depart-value').textContent=d.departureTime;
  document.getElementById('prep-value').textContent=d.prepStartTime;
  document.getElementById('taxi-value').textContent=d.taxiDeadline;
  document.getElementById('travel-value').textContent=d.travelMinutes+'분';
  document.getElementById('weather-value').textContent=d.weatherCondition;
  document.getElementById('weather-delay').textContent='+'+d.weatherDelay+'분';
  const wc=document.getElementById('wake-card');
  if(d.wakeUpTime){
    wc.classList.add('visible');
    document.getElementById('wake-value').textContent=d.wakeUpTime;
  } else {
    wc.classList.remove('visible');
  }
  const bc=document.getElementById('bus-card');
  if(d.busNextMinutes!==null){
    bc.classList.add('visible');
    document.getElementById('bus-value').textContent=d.busNextMinutes+'분 후';
  } else {
    bc.classList.remove('visible');
  }
}

function render(){
  const nm=nowMins();
  const state=determineState(nm,nagajaData);
  updateRing(nm,nagajaData);
  updateStateUI(state,nm,nagajaData);
  updateInfoPanel(nagajaData);
}

window.updateFromFirestore=function(data){
  nagajaData=Object.assign({},nagajaData,data);
  render();
};

function initDataSource(){
  if(NAGAJA_CONFIG.dataSource==='demo'){
    const now=new Date(), base=now.getHours()*60+now.getMinutes();
    function ms(m){
      const h=Math.floor(((m%1440)+1440)%1440/60), mm=Math.floor(m%60);
      return pad(h)+':'+pad(mm);
    }
    nagajaData={
      classStartTime: ms(base+40), className:'캡스톤디자인',
      departureTime:  ms(base+15), prepStartTime: ms(base-5),
      taxiDeadline:   ms(base+25), travelMinutes: 22,
      weatherCondition:'맑음', weatherDelay:0, busNextMinutes:null,
    };
  } else if(NAGAJA_CONFIG.dataSource==='file'){
    setInterval(async()=>{
      try{
        const r=await fetch(NAGAJA_CONFIG.stateFilePath+'?t='+Date.now());
        if(r.ok){ const d=await r.json(); nagajaData=Object.assign({},nagajaData,d); }
      }catch(e){}
    },NAGAJA_CONFIG.pollIntervalMs);
  } else if(NAGAJA_CONFIG.dataSource==='websocket'){
    function connectWS(){
      const ws=new WebSocket(NAGAJA_CONFIG.wsUrl);
      ws.onmessage=(e)=>{ try{ window.updateFromFirestore(JSON.parse(e.data)); }catch{} };
      ws.onclose=()=>setTimeout(connectWS,3000);
    }
    connectWS();
  }
}

initDataSource();
render();
setInterval(render,1000);
</script>
</body>
</html>
