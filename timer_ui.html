<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0">
  <title>나가자 — 출발 타이머</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:           #F5F5F5;
      --card-bg:      #FFFFFF;
      --card-shadow:  0 1px 4px rgba(0,0,0,0.10);
      --ring-track:   rgba(0,0,0,0.07);
      --ring-green:   #22C55E;
      --ring-yellow:  #F59E0B;
      --ring-red:     #EF4444;
      --txt-primary:  #111827;
      --txt-secondary:#6B7280;
      --txt-muted:    #9CA3AF;
      --state-green:  #16A34A;
      --state-yellow: #D97706;
      --state-red:    #DC2626;
      --accent-blue:  #3B82F6;
      --divider:      rgba(0,0,0,0.07);
    }
    html, body {
      width: 800px; height: 480px;
      overflow: hidden;
      background: var(--bg);
      color: var(--txt-primary);
      font-family: 'Noto Sans KR', 'Arial', sans-serif;
      user-select: none;
    }
    #app {
      display: flex; width: 100%; height: 100%;
      position: relative;
      background: var(--bg);
    }

    /* ══ 좌: 타이머 섹션 480×480 ══ */
    #timer-section {
      width: 480px; height: 480px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    #timer-svg {
      position: absolute; top: 0; left: 0;
      width: 480px; height: 480px;
    }

    .ring-track   { fill: none; stroke: var(--ring-track); stroke-width: 20; }
    .ring-relaxed { fill: none; stroke: var(--ring-green);  stroke-width: 20; stroke-linecap: butt; }
    .ring-hurry   { fill: none; stroke: var(--ring-yellow); stroke-width: 20; stroke-linecap: butt; }
    .ring-late    { fill: none; stroke: var(--ring-red);    stroke-width: 20; stroke-linecap: butt; }

    .seg-label { font-size: 11px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; }

    /* 중앙 텍스트 */
    #center-display {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; width: 220px;
    }
    #state-label {
      font-size: 11px; letter-spacing: 0.15em;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--txt-muted);
      transition: color 0.4s;
    }
    #countdown {
      font-family: 'Noto Sans KR', monospace;
      font-size: 56px; font-weight: 300;
      line-height: 1; letter-spacing: -1px;
      color: var(--txt-muted);
      transition: color 0.4s, font-size 0.3s;
    }
    #countdown.urgent {
      font-size: 60px; font-weight: 700;
      font-family: 'Courier New', monospace;
    }
    #countdown-sub {
      font-size: 10px; color: var(--txt-muted);
      margin-top: 8px; letter-spacing: 0.05em;
      font-weight: 400;
    }

    /* ══ 우: 정보 패널 320px ══ */
    #info-section {
      width: 320px; height: 100%;
      display: flex; flex-direction: column;
      padding: 18px 16px 14px 8px;
      gap: 10px;
    }

    /* 상단: 현재 시각 + 수업 부제 */
    #header-block { padding-bottom: 10px; border-bottom: 1px solid var(--divider); }
    #current-time {
      font-size: 28px; font-weight: 300;
      letter-spacing: -0.5px;
      color: var(--txt-primary);
      line-height: 1;
    }
    #class-subtitle {
      font-size: 11px; color: var(--txt-secondary);
      margin-top: 4px; font-weight: 400;
    }

    /* 가로 3열 정보 카드 (준비|이동|출발) */
    #info-row-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 14px 12px;
      display: flex;
      align-items: center;
    }
    .info-col {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 3px;
    }
    .info-col-icon  { font-size: 15px; }
    .info-col-value {
      font-size: 17px; font-weight: 700;
      color: var(--txt-primary);
      line-height: 1;
    }
    .info-col-label { font-size: 10px; color: var(--txt-muted); font-weight: 400; }
    .info-col-divider {
      width: 1px; height: 36px;
      background: var(--divider);
      margin: 0 4px;
    }

    /* 기상 알람 카드 */
    #wake-card {
      display: none;
      background: rgba(219,234,254,0.7);
      border-radius: 12px;
      padding: 9px 12px;
      align-items: center; gap: 8px;
    }
    #wake-card.visible { display: flex; }
    #wake-label { font-size: 10px; color: var(--accent-blue); font-weight: 500; flex: 1; }
    #wake-value { font-size: 15px; font-weight: 700; color: var(--accent-blue); }

    /* 날씨 + 혼잡도 행 */
    #detail-row {
      display: flex; gap: 8px;
    }
    .detail-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      padding: 8px 10px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .detail-card-top {
      display: flex; align-items: center; gap: 5px;
    }
    .detail-icon  { font-size: 13px; }
    .detail-label { font-size: 11px; color: var(--txt-secondary); font-weight: 400; }
    .detail-badge {
      font-size: 10px; font-weight: 500;
      padding: 1px 6px; border-radius: 99px;
      background: rgba(0,0,0,0.06);
      color: var(--txt-secondary);
      align-self: flex-start;
    }
    .detail-badge.warn { background: rgba(239,68,68,0.1); color: var(--state-red); }

    #congestion-card { display: none; }
    #congestion-card.visible { display: flex; }

    /* AI 예측 상태 */
    #plan-status {
      font-size: 10px; color: var(--txt-muted);
      text-align: center; margin-top: auto;
      padding-top: 4px; font-weight: 300;
    }

    /* ══ 포기 오버레이 ══ */
    #give-up-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(245,245,245,0.96);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; z-index: 99;
    }
    #give-up-overlay.visible { display: flex; }
    #give-up-emoji { font-size: 64px; animation: gup 3s ease-in-out infinite; }
    @keyframes gup { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
    #give-up-title { font-size: 28px; font-weight: 700; color: #9CA3AF; }
    #give-up-sub   { font-size: 13px; color: #D1D5DB; }
    #give-up-clock { font-family: 'Courier New', monospace; font-size: 44px; color: #D1D5DB; margin-top: 4px; }

    @keyframes blink-red { 0%,100%{opacity:1} 50%{opacity:.3} }
    #app.late #countdown.urgent { animation: blink-red 1.1s ease-in-out infinite; }

    /* ══ 상태별 배경 깜빡임 (시연/촬영용) ══ */
    @keyframes blink-bg-yellow { 0%,100%{ background-color: var(--bg); } 50%{ background-color: #FCD34D; } }
    @keyframes blink-bg-red    { 0%,100%{ background-color: var(--bg); } 50%{ background-color: #FCA5A5; } }
    @keyframes blink-bg-green  { 0%,100%{ background-color: var(--bg); } 50%{ background-color: #86EFAC; } }
    #app.hurry      { animation: blink-bg-yellow 1.0s ease-in-out infinite; }   /* 나가자: 노랑 */
    #app.late       { animation: blink-bg-red 0.5s ease-in-out infinite; }      /* 지각위기: 빨강(더 빠르게) */
    #app.alarm-ring { animation: blink-bg-green 0.7s ease-in-out infinite; }    /* 기상알람: 초록 (우선) */
  </style>
</head>
<body>
<div id="app" class="relaxed">

  <!-- ══ 좌: 원형 타이머 ══ -->
  <div id="timer-section">
    <svg id="timer-svg" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
      <!-- 배경 트랙 -->
      <circle class="ring-track" cx="240" cy="240" r="200"/>

      <!-- 세그먼트 -->
      <circle id="seg-relaxed" class="ring-relaxed" cx="240" cy="240" r="200"
              transform="rotate(-90 240 240)"
              stroke-dasharray="0 1256.64" stroke-dashoffset="0"/>
      <circle id="seg-hurry"   class="ring-hurry"   cx="240" cy="240" r="200"
              transform="rotate(-90 240 240)"
              stroke-dasharray="0 1256.64" stroke-dashoffset="0"/>
      <circle id="seg-late"    class="ring-late"    cx="240" cy="240" r="200"
              transform="rotate(-90 240 240)"
              stroke-dasharray="0 1256.64" stroke-dashoffset="0"/>

      <!-- 포인터 -->
      <circle id="pointer" r="10" fill="#374151" cx="240" cy="40"/>

      <!-- 구간 이름 레이블 (링 바깥) -->
      <text id="lbl-relaxed" class="seg-label" fill="#16A34A" text-anchor="middle" dominant-baseline="middle"></text>
      <text id="lbl-hurry"   class="seg-label" fill="#D97706" text-anchor="middle" dominant-baseline="middle"></text>
      <text id="lbl-late"    class="seg-label" fill="#DC2626" text-anchor="middle" dominant-baseline="middle"></text>

      <!-- 경계 시각 pill 배지 -->
      <g id="badge-start">
        <rect id="br-start" rx="6" ry="6" fill="#22C55E" opacity="0.9"/>
        <text id="bt-start" font-size="10" fill="white" font-weight="bold"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Courier New',monospace"></text>
      </g>
      <g id="badge-b1">
        <rect id="br-b1" rx="6" ry="6" fill="#F59E0B" opacity="0.9"/>
        <text id="bt-b1" font-size="10" fill="white" font-weight="bold"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Courier New',monospace"></text>
      </g>
      <g id="badge-b2">
        <rect id="br-b2" rx="6" ry="6" fill="#EF4444" opacity="0.9"/>
        <text id="bt-b2" font-size="10" fill="white" font-weight="bold"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Courier New',monospace"></text>
      </g>
      <g id="badge-end">
        <rect id="br-end" rx="6" ry="6" fill="#B91C1C" opacity="0.9"/>
        <text id="bt-end" font-size="10" fill="white" font-weight="bold"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Courier New',monospace"></text>
      </g>
    </svg>

    <!-- 중앙 텍스트 -->
    <div id="center-display">
      <div id="state-label">여유</div>
      <div id="countdown">--:--</div>
      <div id="countdown-sub">다음 수업</div>
    </div>
  </div>

  <!-- ══ 우: 정보 패널 ══ -->
  <div id="info-section">

    <!-- 현재 시각 + 수업 부제 -->
    <div id="header-block">
      <div id="current-time">--:--</div>
      <div id="class-subtitle">수업 정보 없음</div>
    </div>

    <!-- 가로 3열 카드: 준비 | 이동 | 출발 -->
    <div id="info-row-card">
      <div class="info-col">
        <div class="info-col-icon">☕</div>
        <div class="info-col-value" id="prep-value">--분</div>
        <div class="info-col-label">준비</div>
      </div>
      <div class="info-col-divider"></div>
      <div class="info-col">
        <div class="info-col-icon">🚌</div>
        <div class="info-col-value" id="travel-value">--분</div>
        <div class="info-col-label">이동</div>
      </div>
      <div class="info-col-divider"></div>
      <div class="info-col">
        <div class="info-col-icon">🚶</div>
        <div class="info-col-value" id="depart-value">--:--</div>
        <div class="info-col-label">출발</div>
      </div>
    </div>

    <!-- 기상 알람 (조건부) -->
    <div id="wake-card">
      <span style="font-size:16px">🔔</span>
      <span id="wake-label">기상 알람</span>
      <span id="wake-value">--:--</span>
    </div>

    <!-- 날씨 + 혼잡도 -->
    <div id="detail-row">
      <div class="detail-card">
        <div class="detail-card-top">
          <span class="detail-icon">🌤️</span>
          <span class="detail-label" id="weather-value">맑음</span>
        </div>
        <span class="detail-badge" id="weather-delay">+0분</span>
      </div>
      <div class="detail-card" id="congestion-card">
        <div class="detail-card-top">
          <span class="detail-icon">🚦</span>
          <span class="detail-label">혼잡도 보정</span>
        </div>
        <span class="detail-badge warn" id="congestion-delay">+0분</span>
      </div>
    </div>

    <!-- AI 예측 상태 -->
    <div id="plan-status">AI 예측 이용함</div>

  </div>

  <!-- ══ 포기 오버레이 ══ -->
  <div id="give-up-overlay">
    <div id="give-up-emoji">😮‍💨</div>
    <div id="give-up-title">오늘은 포기..?</div>
    <div id="give-up-sub">지금은 지각을 피하기 어렵습니다</div>
    <div id="give-up-clock">--:--</div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   나가자 — 타이머 UI  v2.0  (앱 스타일 통일)
   SVG: viewBox 480×480 | cx=cy=240 | r=200 | stroke=20
   CIRC = 2π×200 ≈ 1256.64
   ════════════════════════════════════════════ */

const NAGAJA_CONFIG = {
  dataSource: 'websocket', // 'demo' | 'file' | 'websocket' 기본값 'websocket'은 백엔드 서버의 WebSocket에서 실시간 데이터 수신
  stateFilePath: '/tmp/nagaja_state.json',
  wsUrl: 'ws://localhost:8765',
  pollIntervalMs: 2000,
};

const R = 200, CX = 240, CY = 240;
const CIRC = 2 * Math.PI * R;
const STATE = { RELAXED:'relaxed', HURRY:'hurry', LATE:'late' };

let nagajaData = {
  wakeUpTime:             null,
  classStartTime:         '--:--',
  className:              '수업',
  departureTime:          '--:--',
  prepStartTime:          '--:--',
  travelMinutes:          30,
  prepMinutes:            30,
  weatherCondition:       '맑음',
  weatherDelay:           0,
  congestionDelay:        0,
  displayColor:           'GREEN',
  remainingMarginMinutes: 0,
  planStatus:             'CALCULATED',
  taxiDeadline:           null,
  busNextMinutes:         null,
};

function pad(n){ return String(n).padStart(2,'0'); }
function toMins(str){
  if(!str || str==='--:--') return 0;
  const [h,m]=str.split(':').map(Number);
  return h*60+m;
}
function nowMins(){ const d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; }
function nowStr(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function mmss(mins){
  if(mins<0) mins=0;
  const m=Math.floor(mins), s=Math.round((mins-m)*60);
  return pad(m)+':'+pad(s);
}
function segDash(from,to){
  const len=(to-from)*CIRC;
  return { da:`${len} ${CIRC-len}`, doff:-from*CIRC };
}
function ratioToXY(ratio, r){
  const rad=(ratio*360-90)*Math.PI/180;
  return { x: CX+r*Math.cos(rad), y: CY+r*Math.sin(rad) };
}

function placeBadge(prefix, ratio, label, fillColor){
  const el_r = document.getElementById('br-'+prefix);
  const el_t = document.getElementById('bt-'+prefix);
  if(!label){ el_r.setAttribute('width','0'); el_t.textContent=''; return; }

  const BADGE_R = R - 32;
  const p = ratioToXY(ratio, BADGE_R);

  el_r.setAttribute('fill', fillColor);
  el_t.setAttribute('x', p.x.toFixed(1));
  el_t.setAttribute('y', p.y.toFixed(1));
  el_t.textContent = label;

  let tw = 36;
  try { tw = el_t.getBBox().width; } catch(e){}

  const pw = tw + 12, ph = 16;
  el_r.setAttribute('x', (p.x - pw/2).toFixed(1));
  el_r.setAttribute('y', (p.y - ph/2).toFixed(1));
  el_r.setAttribute('width', pw.toFixed(1));
  el_r.setAttribute('height', ph.toFixed(0));
}

/* displayColor (서버값)으로 상태 결정 */
function determineState(d){
  const c = d.displayColor || 'GREEN';
  if(c === 'RED')    return STATE.LATE;
  if(c === 'YELLOW') return STATE.HURRY;
  return STATE.RELAXED;
}

function updateRing(nm, d){
  if(!d.prepStartTime || d.prepStartTime==='--:--') return;
  const ps  = toMins(d.prepStartTime);
  const dep = toMins(d.departureTime);
  const end = dep + (d.travelMinutes || 30);
  const total = end - ps;
  if(total <= 0) return;

  const r0 = 0;
  const r1 = Math.max(0, Math.min(1, (dep - 10 - ps) / total));
  const r2 = Math.max(r1, Math.min(1, (dep - ps) / total));
  const r3 = 1;

  function setS(id,fr,to){
    const s=segDash(fr,to), el=document.getElementById(id);
    el.setAttribute('stroke-dasharray', s.da);
    el.setAttribute('stroke-dashoffset', s.doff);
  }
  setS('seg-relaxed', r0, r1);
  setS('seg-hurry',   r1, r2);
  setS('seg-late',    r2, r3);

  // 포인터
  const nr = Math.max(0, Math.min(1, (nm - ps) / total));
  const pp = ratioToXY(nr, R);
  document.getElementById('pointer').setAttribute('cx', pp.x.toFixed(1));
  document.getElementById('pointer').setAttribute('cy', pp.y.toFixed(1));

  // 구간 이름 레이블
  function placeSegLabel(id,fr,to,txt){
    const el=document.getElementById(id);
    if(to-fr < 0.045){ el.textContent=''; return; }
    const p=ratioToXY((fr+to)/2, R+30);
    el.setAttribute('x', p.x.toFixed(1));
    el.setAttribute('y', p.y.toFixed(1));
    el.textContent = txt;
  }
  placeSegLabel('lbl-relaxed', r0, r1, '여유');
  placeSegLabel('lbl-hurry',   r1, r2, '나가자');
  placeSegLabel('lbl-late',    r2, r3, '지각');

  // 경계 배지
  const dep10h=Math.floor((dep-10)/60), dep10m=((dep-10)%60+60)%60;
  placeBadge('start', 0,   d.prepStartTime,                    '#22C55E');
  placeBadge('b1',    r1,  pad(dep10h)+':'+pad(dep10m),        '#F59E0B');
  placeBadge('b2',    r2,  d.departureTime,                    '#EF4444');
  placeBadge('end',   1,   d.classStartTime,                   '#B91C1C');
}

function updateStateUI(state, nm, d){
  const app      = document.getElementById('app');
  const giveUp   = document.getElementById('give-up-overlay');
  const countdown= document.getElementById('countdown');
  const stateLabel=document.getElementById('state-label');
  const countSub = document.getElementById('countdown-sub');

  // 기상알람이 울리는 동안엔 alarm-ring 클래스로 배경을 초록 깜빡임
  app.className = state + (d.alarmRinging ? ' alarm-ring' : '');
  giveUp.classList.remove('visible');

  const dep = toMins(d.departureTime);

  if(state === STATE.RELAXED){
    // 여유: 링 중앙에 수업 시각 표시 (앱과 동일)
    countdown.classList.remove('urgent');
    countdown.textContent = d.classStartTime || '--:--';
    countdown.style.color = 'var(--txt-muted)';
    stateLabel.textContent = '다음 수업';
    stateLabel.style.color = 'var(--txt-muted)';
    countSub.textContent   = d.className || '';

  } else if(state === STATE.HURRY){
    countdown.classList.add('urgent');
    const rem = dep - nm;
    countdown.textContent = mmss(rem);
    countdown.style.color = 'var(--state-yellow)';
    stateLabel.textContent = '나가자!';
    stateLabel.style.color = 'var(--state-yellow)';
    countSub.textContent   = '지금 출발하면 정각 도착';

  } else { // LATE
    countdown.classList.add('urgent');
    const rem = dep - nm;
    countdown.textContent = mmss(rem);
    countdown.style.color = 'var(--state-red)';
    stateLabel.textContent = '지각 위기';
    stateLabel.style.color = 'var(--state-red)';
    countSub.textContent   = '지금 바로 출발하세요';
  }
}

function updateInfoPanel(d){
  // 현재 시각 + 부제
  document.getElementById('current-time').textContent = nowStr();
  const subtitle = (d.classStartTime && d.classStartTime !== '--:--')
    ? `다음 수업 ${d.classStartTime} · ${d.className || ''}`
    : '수업 정보 없음';
  document.getElementById('class-subtitle').textContent = subtitle;

  // 3열 카드
  document.getElementById('prep-value').textContent   = (d.prepMinutes || d.travelMinutes || '--') + '분';
  document.getElementById('travel-value').textContent = (d.travelMinutes || '--') + '분';
  document.getElementById('depart-value').textContent = d.departureTime || '--:--';

  // 기상 알람 카드
  const wc = document.getElementById('wake-card');
  if(d.wakeUpTime){
    wc.classList.add('visible');
    document.getElementById('wake-value').textContent = d.wakeUpTime;
  } else {
    wc.classList.remove('visible');
  }

  // 날씨
  document.getElementById('weather-value').textContent = d.weatherCondition || '맑음';
  const wDelay = d.weatherDelay || 0;
  const wBadge = document.getElementById('weather-delay');
  wBadge.textContent = (wDelay > 0 ? '+' : '') + wDelay + '분';
  wBadge.className   = 'detail-badge' + (wDelay > 0 ? ' warn' : '');

  // 혼잡도 카드
  const cc = document.getElementById('congestion-card');
  const cDelay = d.congestionDelay || 0;
  if(cDelay !== 0){
    cc.classList.add('visible');
    const cBadge = document.getElementById('congestion-delay');
    cBadge.textContent = (cDelay > 0 ? '+' : '') + cDelay + '분';
  } else {
    cc.classList.remove('visible');
  }

  // 플랜 상태
  const status = d.planStatus === 'FALLBACK' ? '기본값 사용 (AI 예측 실패)' : 'AI 예측 이용함';
  document.getElementById('plan-status').textContent = status;
}

function render(){
  const nm    = nowMins();
  const state = determineState(nagajaData);
  updateRing(nm, nagajaData);
  updateStateUI(state, nm, nagajaData);
  updateInfoPanel(nagajaData);
}

window.updateFromFirestore = function(data){
  nagajaData = Object.assign({}, nagajaData, data);
  render();
};

function initDataSource(){
  if(NAGAJA_CONFIG.dataSource === 'demo'){
    const now=new Date(), base=now.getHours()*60+now.getMinutes();
    function ms(m){
      const h=Math.floor(((m%1440)+1440)%1440/60), mm=Math.floor(((m%60)+60)%60);
      return pad(h)+':'+pad(mm);
    }
    nagajaData = {
      wakeUpTime:       ms(base - 5),
      classStartTime:   ms(base + 40),
      className:        '캡스톤디자인',
      departureTime:    ms(base + 15),
      prepStartTime:    ms(base - 5),
      travelMinutes:    22,
      prepMinutes:      25,
      weatherCondition: '맑음',
      weatherDelay:     0,
      congestionDelay:  5,
      displayColor:     'GREEN',
      remainingMarginMinutes: 20,
      planStatus:       'CALCULATED',
      taxiDeadline:     null,
      busNextMinutes:   null,
    };
  } else if(NAGAJA_CONFIG.dataSource === 'file'){
    setInterval(async()=>{
      try{
        const r=await fetch(NAGAJA_CONFIG.stateFilePath+'?t='+Date.now());
        if(r.ok){ const d=await r.json(); nagajaData=Object.assign({},nagajaData,d); }
      }catch(e){ console.error('[NaGaJa] 상태 파일 읽기 실패:', e.message); }
    }, NAGAJA_CONFIG.pollIntervalMs);
  } else if(NAGAJA_CONFIG.dataSource === 'websocket'){
    function connectWS(){
      const ws=new WebSocket(NAGAJA_CONFIG.wsUrl);
      ws.onmessage=(e)=>{ try{ window.updateFromFirestore(JSON.parse(e.data)); }catch{} };
      ws.onclose=()=>setTimeout(connectWS, 3000);
    }
    connectWS();
  }
}

initDataSource();
render();
setInterval(render, 1000);
</script>
</body>
</html>
