<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0">
  <title>나가자 — 부저/버튼 하드웨어 테스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0F172A; --panel:#1E293B; --panel2:#334155;
      --txt:#F1F5F9; --muted:#94A3B8;
      --green:#22C55E; --yellow:#F59E0B; --red:#EF4444; --blue:#3B82F6;
    }
    html,body{
      width:800px;height:480px;overflow:hidden;
      background:var(--bg);color:var(--txt);
      font-family:'Noto Sans KR',sans-serif;user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    #app{display:flex;width:100%;height:100%}

    /* ── 좌: 상태 표시 ── */
    #status{
      width:300px;flex-shrink:0;height:100%;
      padding:18px 16px;display:flex;flex-direction:column;gap:12px;
      border-right:1px solid var(--panel2);
    }
    .title{font-size:16px;font-weight:700;letter-spacing:-.3px}
    .title small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px}

    /* 부저 상태 큰 표시등 */
    .buzzer-box{
      background:var(--panel);border-radius:16px;padding:16px;
      display:flex;flex-direction:column;align-items:center;gap:10px;
    }
    #buzzer-light{
      width:96px;height:96px;border-radius:50%;
      background:#475569;transition:all .08s;
      display:flex;align-items:center;justify-content:center;font-size:40px;
      box-shadow:inset 0 2px 6px rgba(0,0,0,.4);
    }
    #buzzer-light.on{
      background:var(--red);
      box-shadow:0 0 28px 6px rgba(239,68,68,.7),inset 0 2px 6px rgba(0,0,0,.2);
    }
    #buzzer-text{font-size:14px;font-weight:700;color:var(--muted)}
    #buzzer-text.on{color:var(--red)}

    /* 물리 버튼 표시 */
    .btn-ind{
      background:var(--panel);border-radius:14px;padding:14px;
      display:flex;align-items:center;gap:12px;transition:all .12s;
    }
    .btn-ind.hit{background:var(--green);transform:scale(1.02)}
    .btn-ind .ico{font-size:26px}
    .btn-ind .lab{font-size:12px;color:var(--muted)}
    .btn-ind .val{font-size:13px;font-weight:700}

    /* 연결 상태 + 환경 */
    .meta{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.7}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#64748B;margin-right:5px}
    .dot.ok{background:var(--green)}
    .dot.warn{background:var(--yellow)}

    /* ── 우: 테스트 버튼 + 로그 ── */
    #control{flex:1;height:100%;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .tbtn{
      border:none;border-radius:16px;padding:18px 12px;
      font-family:inherit;font-size:17px;font-weight:700;color:#fff;
      display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
      transition:transform .06s,filter .1s;touch-action:manipulation;
    }
    .tbtn:active{transform:scale(.96);filter:brightness(1.15)}
    .tbtn .e{font-size:26px}
    .tbtn .s{font-size:11px;font-weight:400;opacity:.85}
    .tbtn.beep{background:#2563EB}
    .tbtn.wake{background:#16A34A}
    .tbtn.stop{background:#DC2626}
    .tbtn.hold{background:#7C3AED}
    .tbtn.hold.pressing{background:#9333EA;filter:brightness(1.3)}

    /* 로그 */
    #log{
      flex:1;background:#0B1220;border-radius:14px;padding:10px 12px;
      font-family:'Courier New',monospace;font-size:12px;line-height:1.55;
      overflow-y:auto;color:#CBD5E1;
    }
    #log .t{color:#64748B}
    #log .ok{color:var(--green)}
    #log .hi{color:var(--yellow)}
  </style>
</head>
<body>
<div id="app">

  <!-- 좌: 상태 -->
  <div id="status">
    <div class="title">부저 / 버튼 테스트
      <small>나가자 물리 알람시계 하드웨어 점검</small>
    </div>

    <div class="buzzer-box">
      <div id="buzzer-light">🔇</div>
      <div id="buzzer-text">부저 OFF</div>
    </div>

    <div class="btn-ind" id="btn-ind">
      <div class="ico">🔘</div>
      <div>
        <div class="lab">물리 버튼(GPIO17)</div>
        <div class="val" id="btn-val">대기 중…</div>
      </div>
    </div>

    <div class="meta">
      <div><span class="dot" id="conn-dot"></span><span id="conn-text">서버 연결 대기…</span></div>
      <div><span class="dot" id="gpio-dot"></span><span id="gpio-text">GPIO 상태 확인 중…</span></div>
      <div>부저 핀 GPIO18 · 버튼 핀 GPIO17</div>
    </div>
  </div>

  <!-- 우: 컨트롤 -->
  <div id="control">
    <div class="grid">
      <button class="tbtn wake" data-cmd="wake_alarm">
        <span class="e">🔔</span>기상 알람 시작
        <span class="s">0.5초 간격 · 최대 120초</span>
      </button>
      <button class="tbtn stop" data-cmd="stop_alarm">
        <span class="e">⏹</span>알람 정지
        <span class="s">물리 버튼과 동일 동작</span>
      </button>
      <button class="tbtn beep" data-cmd="double_beep">
        <span class="e">🔊</span>삐삐 (2회)
        <span class="s">상태 전환음 테스트</span>
      </button>
      <button class="tbtn hold" id="hold-btn">
        <span class="e">📢</span>누르는 동안 ON
        <span class="s">꾹 누르면 부저 울림</span>
      </button>
    </div>

    <div id="log"></div>
  </div>
</div>

<script>
const WS_URL = 'ws://localhost:8765';
let ws = null;

const $ = (id) => document.getElementById(id);

function logLine(msg, cls){
  const box = $('log');
  const t = new Date().toLocaleTimeString('ko-KR',{hour12:false});
  const div = document.createElement('div');
  div.innerHTML = `<span class="t">${t}</span> <span class="${cls||''}">${msg}</span>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  while(box.childElementCount > 100) box.removeChild(box.firstChild);
}

function setBuzzer(on){
  $('buzzer-light').classList.toggle('on', on);
  $('buzzer-light').textContent = on ? '🔊' : '🔇';
  $('buzzer-text').classList.toggle('on', on);
  $('buzzer-text').textContent = on ? '부저 ON' : '부저 OFF';
}

let btnTimer = null;
function flashButton(ts){
  const ind = $('btn-ind');
  ind.classList.add('hit');
  $('btn-val').textContent = ts ? `눌림! ${ts}` : '눌림!';
  clearTimeout(btnTimer);
  btnTimer = setTimeout(()=>ind.classList.remove('hit'), 600);
}

function send(cmd){
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({cmd}));
  } else {
    logLine('⚠ 서버에 연결되어 있지 않습니다', 'hi');
  }
}

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    $('conn-dot').className = 'dot ok';
    $('conn-text').textContent = '서버 연결됨';
    logLine('서버에 연결되었습니다', 'ok');
  };
  ws.onclose = () => {
    $('conn-dot').className = 'dot warn';
    $('conn-text').textContent = '연결 끊김 — 재시도 중…';
    setBuzzer(false);
    setTimeout(connect, 2000);
  };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    let m; try{ m = JSON.parse(e.data); }catch{ return; }
    switch(m.event){
      case 'hello':
        if(m.gpio){
          $('gpio-dot').className = 'dot ok';
          $('gpio-text').textContent = '실기기 모드 (GPIO 활성)';
        } else {
          $('gpio-dot').className = 'dot warn';
          $('gpio-text').textContent = '시뮬레이션 모드 (부저 미작동)';
        }
        setBuzzer(!!m.buzzerOn);
        break;
      case 'buzzer': setBuzzer(!!m.on); break;
      case 'button': flashButton(m.ts); break;
      case 'alarm':  logLine(m.active ? '🔔 알람 활성화' : '🔕 알람 종료', 'hi'); break;
      case 'log':    logLine(m.msg, m.msg.includes('버튼') ? 'ok' : ''); break;
    }
  };
}

// 일반 버튼: 클릭 시 명령 전송
document.querySelectorAll('.tbtn[data-cmd]').forEach(b => {
  b.addEventListener('click', () => send(b.dataset.cmd));
});

// 꾹 누르기 버튼: 누르는 동안 ON, 떼면 OFF
const hold = $('hold-btn');
function holdOn(ev){ ev.preventDefault(); hold.classList.add('pressing'); send('buzz_on'); }
function holdOff(){ hold.classList.remove('pressing'); send('buzz_off'); }
hold.addEventListener('mousedown', holdOn);
hold.addEventListener('touchstart', holdOn, {passive:false});
hold.addEventListener('mouseup', holdOff);
hold.addEventListener('mouseleave', () => { if(hold.classList.contains('pressing')) holdOff(); });
hold.addEventListener('touchend', holdOff);
hold.addEventListener('touchcancel', holdOff);

logLine('테스트 화면을 시작합니다…');
connect();
</script>
</body>
</html>
